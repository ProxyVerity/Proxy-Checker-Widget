# Netlify публикует demos/explainer как корень сайта.
# Сборки нет — это статика, Netlify просто раздаёт каталог.
[build]
  publish = "demos/explainer"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
